system: osteocalcin
buffer: 10.0
prefix: solv
job_name: mdequil

md:
  minimize:
    description: Minimize the solvated osteocalcin dimer
    cntrl:
      imin: 1
      maxcyc: 10000
      ncyc: 5000
      ntb: 1
      cut: 9.0
      ntr: 0
      ntpr: 500

  heat:
    description: Heat from 10 to 300 K over 100 ps at constant volume
    cntrl:
      imin: 0
      irest: 0
      ntx: 1
      nstlim: 100000
      dt: 0.001
      tempi: 10.0
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 9.0
      ntpr: 5000
      ntwx: 5000
      ntwe: 0
      ioutfm: 1
      ntxo: 2
      nmropt: 1
    wt:
      - type: TEMP0
        istep1: 0
        istep2: 100000
        value1: 10.0
        value2: 300.0
      - type: END

  equilibrate_nvt:
    description: Equilibrate for 100 ps at 300 K and constant volume
    cntrl:
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 50000
      dt: 0.002
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ig: -1
      ntb: 1
      ntp: 0
      ntc: 2
      ntf: 2
      cut: 9.0
      ntpr: 2500
      ntwx: 2500
      ntwe: 0
      ioutfm: 1
      ntxo: 2

  equilibrate_npt:
    description: Equilibrate for 1 ns at 300 K and 1 bar
    cntrl:
      iwrap: 1
      imin: 0
      irest: 1
      ntx: 5
      nstlim: 500000
      dt: 0.002
      temp0: 300.0
      ntt: 3
      gamma_ln: 2.0
      ig: -1
      ntb: 2
      ntp: 1
      barostat: 2
      taup: 2.0
      pres0: 1.0
      ntc: 2
      ntf: 2
      cut: 9.0
      ntpr: 5000
      ntwx: 5000
      ntwe: 0
      ioutfm: 1
      ntxo: 2

runtime:
  module: amber/25-CUDA_12.6-GCC12.2.0
  executable: pmemd.cuda
  env:
    TEMP: 300
    PRESS: 1.0
  strict_mode: true

slurm:
  job:
    name: osteocalcin-equil
    partition: volta-gpu
    nodes: 1
    time: "02:00:00"
    stdout: "slurm.%j.out"
    stderr: "slurm.%j.err"
    gres: "gpu:1"
    cpus_per_task: 2
    qos: gpu_access
